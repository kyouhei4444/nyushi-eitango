<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef0ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121514" media="(prefers-color-scheme: dark)">
<style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>山梨入試 英単語</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="入試英単語">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: 1カラムのスマホ画面。ホーム/一覧を下タブで切替、学習は全画面の単語カード */
:root{
  --bg:#eef0ec; --surface:#fbfcf9; --ink:#1d2320; --muted:#5d6762; --line:#d6dbd5;
  --grape:#5b2c6f; --grape-soft:#e9dfee; --on-grape:#ffffff;
  --leaf:#2d7547; --leaf-soft:#dcebdf; --miss:#b3402e; --miss-soft:#f5e0da;
  --ring:#b8bfb9;
  --f-en:"Newsreader", "Times New Roman", Georgia, serif;
  --f-ja:"Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1c201e; --ink:#e7ebe8; --muted:#9ba5a0; --line:#2f3633;
  --grape:#c7a2d9; --grape-soft:#33263b; --on-grape:#1b1220;
  --leaf:#72c491; --leaf-soft:#1e3326; --miss:#ee8d7b; --miss-soft:#3e2420; --ring:#47504c;
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1c201e; --ink:#e7ebe8; --muted:#9ba5a0; --line:#2f3633;
  --grape:#c7a2d9; --grape-soft:#33263b; --on-grape:#1b1220;
  --leaf:#72c491; --leaf-soft:#1e3326; --miss:#ee8d7b; --miss-soft:#3e2420; --ring:#47504c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ja);font-size:15px;line-height:1.6;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px calc(88px + env(safe-area-inset-bottom,0px))}
.view{display:flex;flex-direction:column;gap:22px}
.eyebrow{font-size:12px;letter-spacing:.08em;color:var(--muted);font-weight:500}
h1{font-size:26px;line-height:1.25;margin:2px 0 0;font-weight:700;text-wrap:balance}
h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 10px;font-weight:700}
.num{font-variant-numeric:tabular-nums}

/* summary */
.summary{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px}
.sumrow{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.big{font-family:var(--f-en);font-size:44px;line-height:1;font-weight:600}
.big small{font-size:18px;color:var(--muted);font-weight:400}
.meta{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-size:16px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .l{background:var(--grape)}
.bar .s{background:var(--grape-soft)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}

/* modes */
.modes{display:flex;flex-direction:column;gap:10px}
.mode{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:14px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.mode:active{transform:scale(.99)}
.mode .ic{width:44px;height:44px;border-radius:12px;background:var(--grape-soft);color:var(--grape);display:grid;place-items:center;font-family:var(--f-en);font-size:20px;font-weight:600}
.mode b{display:block;font-size:16px}
.mode span{font-size:12.5px;color:var(--muted)}
.mode .go{color:var(--grape);font-size:20px}
.weakbtn{align-self:flex-start;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px}
.weakbtn[aria-pressed="true"]{background:var(--miss-soft);border-color:var(--miss);color:var(--miss);font-weight:700}

/* scope */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field>label,.field>.lab{font-size:12.5px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:1px solid var(--line);background:transparent;border-radius:99px;padding:6px 12px;font-size:13px}
.chip[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:var(--on-grape);font-weight:500}
.scopecount{font-size:13px;color:var(--muted)}
.scopecount b{color:var(--ink)}
.note{font-size:12px;color:var(--muted);margin:0}

/* per-pos */
.posrows{display:flex;flex-direction:column;gap:12px}
.posrow{display:grid;grid-template-columns:7.5em 1fr 4.5em;gap:10px;align-items:center;font-size:13px}
.posrow .num{text-align:right;color:var(--muted)}

.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.cloud i{background:var(--leaf)}
.danger{border:1px solid var(--line);background:transparent;border-radius:10px;padding:8px 12px;font-size:13px;color:var(--muted)}
.danger.arm{border-color:var(--miss);color:var(--miss);font-weight:700}

/* list */
.search{width:100%;font:inherit;font-size:16px;padding:11px 14px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.wl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.wrow{border-bottom:1px solid var(--line)}
.wrow>button{width:100%;display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:12px;align-items:center;text-align:left;background:none;border:0;padding:12px 2px}
.dot{width:9px;height:9px;border-radius:50%;background:var(--line)}
.dot.learn{background:var(--grape)}.dot.weak{background:var(--miss)}.dot.seen{background:var(--grape-soft);box-shadow:inset 0 0 0 1.5px var(--grape)}
.wrow .en{font-family:var(--f-en);font-size:19px;font-weight:600;line-height:1.2}
.wrow .ja{font-size:13px;color:var(--muted);display:block;overflow-wrap:anywhere}
.tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:1px 6px;color:var(--muted);white-space:nowrap}
.tag.A{border-color:var(--grape);color:var(--grape)}
.wdetail{padding:0 2px 14px 24px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.ex{font-family:var(--f-en);font-size:17px;line-height:1.45}
.ex b{color:var(--grape);font-weight:600}
.exja{font-size:13px;color:var(--muted)}
.forms{font-family:var(--f-en);font-style:italic;color:var(--muted);font-size:15px}
.spk{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 12px;font-size:12.5px;align-self:flex-start}
.spk svg{width:16px;height:16px}
.empty{padding:28px 0;text-align:center;color:var(--muted);font-size:14px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
.tabs div{display:flex;width:100%;max-width:560px}
.tabs button{flex:1;background:none;border:0;padding:12px 0 13px;font-size:13px;color:var(--muted);font-weight:500;border-top:2px solid transparent;margin-top:-1px}
.tabs button[aria-current="page"]{color:var(--grape);border-top-color:var(--grape);font-weight:700}

/* study overlay */
.study{position:fixed;inset:0;background:var(--bg);z-index:10;display:flex;flex-direction:column;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.sin{width:100%;max-width:560px;margin:0 auto;padding-inline:16px;flex:1;display:flex;flex-direction:column;min-height:0}
.shead{display:flex;align-items:center;gap:12px;padding-block:12px}
.x{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-size:20px;line-height:1;flex:none}
.prog{flex:1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--grape);transition:width .25s}
.scount{font-size:13px;color:var(--muted);min-width:3.6em;text-align:right}
.sbody{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:14px;padding-block:6px 14px;min-height:0}
.sfoot{display:flex;gap:10px;padding-block:10px 14px}
.btn{flex:1;border:0;border-radius:14px;padding:15px 10px;font-size:16px;font-weight:700;background:var(--grape);color:var(--on-grape)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.ok{background:var(--leaf);color:var(--surface)}
.btn.ng{background:var(--miss);color:var(--surface)}

/* 単語カード（リング穴つき） */
.wcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:30px 22px 24px 22px;min-height:230px;display:flex;flex-direction:column;justify-content:center;gap:10px;text-align:left;width:100%}
.wcard::before{content:"";position:absolute;top:14px;left:14px;width:13px;height:13px;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ring)}
.wcard .poslab{position:absolute;top:12px;right:14px}
.headword{font-family:var(--f-en);font-weight:600;font-size:clamp(30px,9vw,44px);line-height:1.15;overflow-wrap:anywhere}
.headja{font-size:clamp(22px,6vw,28px);font-weight:700;line-height:1.35}
.wcard .hint{font-size:12.5px;color:var(--muted)}
.ans{border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.ans .ja{font-size:19px;font-weight:700}
.choices{display:flex;flex-direction:column;gap:9px}
.choice{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 15px;font-size:15.5px;line-height:1.4}
.choice.en{font-family:var(--f-en);font-size:19px;font-weight:600}
.choice.right{background:var(--leaf-soft);border-color:var(--leaf);color:var(--ink)}
.choice.wrong{background:var(--miss-soft);border-color:var(--miss)}
.choice:disabled{cursor:default}
.verdict{font-weight:700;font-size:15px}
.verdict.ok{color:var(--leaf)}.verdict.ng{color:var(--miss)}
.spell{width:100%;font-family:var(--f-en);font-size:24px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);letter-spacing:.02em}
.spell.ok{border-color:var(--leaf)}.spell.ng{border-color:var(--miss)}
.letters{font-family:var(--f-en);font-size:22px;letter-spacing:.18em;color:var(--muted)}
.res{display:flex;flex-direction:column;gap:16px;padding-top:10px}
.score{font-family:var(--f-en);font-size:64px;font-weight:600;line-height:1}
.score small{font-size:24px;color:var(--muted);font-weight:400}
.missl{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.missl div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.missl .en{font-family:var(--f-en);font-size:18px;font-weight:600}
.missl .ja{color:var(--muted);text-align:right;min-width:0}

/* ホーム画面に追加 */
.install{display:grid;grid-template-columns:52px minmax(0,1fr);gap:12px 14px;align-items:start;background:var(--grape-soft);border-radius:var(--r);padding:14px 16px}
.install img{width:52px;height:52px;border-radius:12px}
.install b{display:block;font-size:15px}
.install p{margin:2px 0 0;font-size:13px;line-height:1.6}
.install p b{display:inline;font-size:inherit}
.install .row{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
.install .row button{border-radius:10px;padding:9px 14px;font-size:14px;border:1px solid var(--grape);background:transparent;color:var(--grape);font-weight:500}
.install .row button.primary{background:var(--grape);color:var(--on-grape);font-weight:700}
.install .later{margin-left:auto;border:0!important;color:var(--muted)!important;font-size:13px!important;padding-inline:4px!important}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:20;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app">
  <main id="home" class="view"></main>
  <main id="list" class="view" hidden></main>
</div>
<nav class="tabs" aria-label="画面切替"><div>
  <button id="tab-home" aria-current="page">ホーム</button>
  <button id="tab-list">単語一覧</button>
</div></nav>
<section id="study" class="study" hidden></section>
<div id="toast" class="toast" hidden></div>

<script>
/* 単語データ: 単語|意味|例文|例文訳|レベル|不規則変化|出題年数
   出題年数 = 2021〜2026年度の山梨県公立高校入試（英語）6年分のうち、その語が出た年の数。
   レベルは出題年数から決める（A 最頻出=4〜6年、B 頻出=2〜3年、C 重要=1年以下） */
const RAW = `
#動
add|加える|Can I add one more idea?|もう一つ考えを加えてもいいですか。|B||2
agree|賛成する、同意する|I agree with your idea.|私はあなたの考えに賛成です。|B||2
arrive|到着する|We arrived at the stadium at ten.|私たちは10時にスタジアムに着いた。|C||1
ask|たずねる、頼む|I asked my teacher to check my speech.|私は先生にスピーチを確認してくれるよう頼んだ。|A||5
become|～になる|She became a famous scientist.|彼女は有名な科学者になった。|B|became-become|3
begin|始める、始まる|The festival will begin at nine.|祭りは9時に始まる。|B|began-begun|2
believe|信じる|I can't believe it.|それは信じられない。|B||3
borrow|借りる|Can I borrow your umbrella?|かさを借りてもいいですか。|C||1
burn|燃やす、燃える|Some garbage is burned at the plant.|一部のごみは工場で燃やされる。|B||3
carry|運ぶ、持ち歩く|I always carry my own bag.|私はいつも自分の袋を持ち歩いている。|B||3
change|変える、変わる|The Internet has changed our lives.|インターネットは私たちの生活を変えた。|A||4
check|確認する、調べる|Let's check the information on the website.|ウェブサイトで情報を確認しよう。|B||2
choose|選ぶ|Choose one topic for your speech.|スピーチの話題を一つ選びなさい。|A|chose-chosen|4
clean|そうじする、きれいにする|We cleaned the river with local people.|私たちは地域の人たちと川をそうじした。|A||5
climb|登る|We climbed Mt. Fuji last summer.|私たちは去年の夏に富士山に登った。|B||2
collect|集める|The students collected used umbrellas.|生徒たちは使われなくなったかさを集めた。|A||5
communicate|意思を伝え合う|We communicated with gestures.|私たちはジェスチャーで意思を伝え合った。|C||1
continue|続ける|Let's continue this activity next year.|この活動を来年も続けよう。|B||3
create|創り出す|They created a new logo for the town.|彼らは町の新しいロゴを作った。|B||3
cut|切る|Cut the paper into small pieces.|紙を小さく切りなさい。|A|cut-cut|4
decide|決める|We decided to make a poster.|私たちはポスターを作ることに決めた。|A||6
design|デザインする、設計する|She designed a bag from old clothes.|彼女は古い服からかばんをデザインした。|B||3
develop|発達させる、開発する|Scientists developed a new machine.|科学者たちは新しい機械を開発した。|C||1
draw|（線で絵を）描く|He drew a picture of his hometown.|彼はふるさとの絵を描いた。|B|drew-drawn|3
enjoy|楽しむ|I enjoyed talking with the ALT.|ALTと話すのを楽しんだ。|A||6
explain|説明する|Can you explain the rule in English?|そのルールを英語で説明できますか。|C||1
feel|感じる|I feel happy when I help people.|人を助けると幸せな気持ちになる。|A|felt-felt|6
fill|満たす、（空所を）うめる|Fill in the blanks with one word.|空所に1語を入れなさい。|B||3
find|見つける、～とわかる|I found the book interesting.|その本はおもしろいとわかった。|A|found-found|6
finish|終える|Have you finished your homework?|宿題は終わった？|A||5
follow|従う、ついて行く|Please follow the rules.|ルールに従ってください。|C||1
forget|忘れる|Don't forget to bring your textbook.|教科書を持ってくるのを忘れないで。|B|forgot-forgotten|3
guess|推測する|Can you guess what this is?|これが何か当てられる？|B||2
happen|起こる|What happened to you?|どうしたの？|B||3
hear|聞こえる、聞く|I heard about the event from my friend.|友達からその行事について聞いた。|A|heard-heard|6
help|手伝う、助ける|Can you help me with my homework?|宿題を手伝ってくれる？|A||6
hold|開催する、持つ|The contest is held every year.|そのコンテストは毎年開かれる。|A|held-held|5
hope|望む|I hope you'll enjoy your stay.|滞在を楽しんでくれるといいな。|A||5
imagine|想像する|Imagine life without smartphones.|スマートフォンのない生活を想像してみて。|C||1
improve|改善する、上達させる|I want to improve my English.|英語を上達させたい。|B||3
introduce|紹介する|Let me introduce my hometown.|私のふるさとを紹介させてください。|B||3
invent|発明する|Who invented the telephone?|誰が電話を発明したの？|C||1
join|参加する、加わる|Why don't you join our club?|私たちの部に入りませんか。|A||5
keep|保つ、持ち続ける|Keep the river clean.|川をきれいに保とう。|A|kept-kept|5
learn|学ぶ、身につける|I learned a lot from this experience.|この経験から多くを学んだ。|A||6
leave|出発する、置いていく、残す|Don't leave food on your plate.|お皿に食べ物を残さないで。|A|left-left|5
let|～させる|Let me tell you about my plan.|私の計画についてお話しさせてください。|A|let-let|6
lose|失う、負ける|I lost my umbrella on the train.|電車でかさをなくした。|B|lost-lost|2
match|合う、一致させる|Choose the picture that matches the story.|話に合う絵を選びなさい。|B||3
mean|意味する|What does this word mean?|この単語はどういう意味ですか。|A|meant-meant|6
need|必要とする|We need more volunteers.|もっとボランティアが必要だ。|A||5
order|注文する|I ordered pizza for lunch.|昼食にピザを注文した。|A||6
pay|払う|I paid five dollars for this bag.|このかばんに5ドル払った。|B|paid-paid|2
pick|摘む、拾う|We picked up garbage on the beach.|私たちは海岸でごみを拾った。|C||1
practice|練習する|I practice the guitar every day.|私は毎日ギターを練習する。|B||2
produce|生産する|Yamanashi produces a lot of grapes.|山梨はたくさんのぶどうを生産している。|C||1
protect|守る|We must protect the environment.|私たちは環境を守らなければならない。|B||2
put|置く|Where should I put this box?|この箱をどこに置けばいいですか。|A|put-put|4

const WORDS = [];
(function parse(){

    const [w, ja, ex, exja, lv, forms, y] = l.split('|');
    WORDS.push({ id: cur + ':' + w, w, ja, ex, exja, lv, forms: forms || '', pos: cur, y: +y || 0 });
  });
})();
const BYID = Object.fromEntries(WORDS.map(x => [x.id, x]));
const yLabel = x => x.y ? '出題' + x.y + '年分' : '過去問になし';

/* ---------- 状態と保存 ---------- */
const LS_KEY = 'yamanashi-nyushi-eitango-v1';
const DEF_SET = { pos: [...POS_ORDER], lv: ['A','B','C'], dir: 'ej', size: 20, auto: true, weak: false };
let S = { p: {}, days: [], settings: { ...DEF_SET } };
let hadLocalSettings = false;
try {
  const raw = localStorage.getItem(LS_KEY);
  if (raw) { const o = JSON.parse(raw); S.p = o.p || {}; S.days = o.days || []; if (o.settings) { S.settings = { ...DEF_SET, ...o.settings }; hadLocalSettings = true; } }
} catch (e) {}

function today() { const d = new Date(); return Math.floor((d.getTime() - d.getTimezoneOffset() * 60000) / 864e5); }
const INTERVAL = [0, 0, 1, 3, 7, 14];
const st = id => S.p[id];
const isLearned = id => (st(id)?.b || 0) >= 3;
const isWeak = id => { const e = st(id); return !!e && e.x > 0 && e.b < 3; };
const isSeen = id => !!st(id);
function isDue(id) { const e = st(id); if (!e) return true; return today() - e.d >= INTERVAL[e.b]; }

let db = null, docRef = null, saving = false, pendingSave = false, saveTimer = null, syncMode = 'local';
function persist() {
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  if (!docRef) return;
  clearTimeout(saveTimer); saveTimer = setTimeout(pushRemote, 1500);
}
async function pushRemote() {
  if (!docRef) return;
  if (saving) { pendingSave = true; return; }
  saving = true;
  try { await docRef.set({ v: 1, p: S.p, days: S.days.slice(-90), settings: S.settings }); }
  catch (e) { if (e && (e.code === 'invalid_argument' || e.code === 'revoked' || e.code === 'not_granted')) { docRef = null; setSync('local'); } }
  finally { saving = false; if (pendingSave) { pendingSave = false; pushRemote(); } }
}
function mergeRemote(r) {
  if (!r) return;
  const rp = r.p || {};
  for (const id in rp) {
    const a = S.p[id], b = rp[id];
    if (!a || b.n > a.n || (b.n === a.n && b.d > a.d)) S.p[id] = b;
  }
  S.days = [...new Set([...(S.days || []), ...(r.days || [])])].sort((a, b) => a - b).slice(-90);
  if (r.settings && !hadLocalSettings) S.settings = { ...DEF_SET, ...r.settings };
}
async function initSync() {
  try {
    if (!window.claude || !window.claude.use) return;
    const [d, u] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if (!d || !u) return;
    const uid = await u.id();
    if (!uid) return;
    db = d; docRef = db.doc('data/users/' + uid + '/progress');
    const snap = await docRef.get();
    if (snap.exists) mergeRemote(snap.data());
    setSync('cloud');
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
    if (Object.keys(S.p).length) pushRemote();
    render();
  } catch (e) { docRef = null; setSync('local'); }
}
function setSync(m) { syncMode = m; const el = document.getElementById('sync'); if (el) renderSync(el); }
function renderSync(el) {
  el.className = 'sync' + (syncMode === 'cloud' ? ' cloud' : '');
  el.innerHTML = '<i></i>' + (syncMode === 'cloud' ? '学習記録は claude.ai のアカウントに保存されます（ほかの端末でも続きから）' : '学習記録はこの端末のブラウザに保存されます');
}

function speak(t) {
  try {
    const s = window.speechSynthesis; if (!s) return;
    s.cancel();
    const u = new SpeechSynthesisUtterance(t.replace(/~|\.\.\./g, ' ').replace(/\bA\b(?= or| and| but)/g, 'this').replace(/\bB\b/g, 'that'));
    u.lang = 'en-US'; u.rate = 0.9; s.speak(u);
  } catch (e) {}
}
function hl(it) {
  const ex = esc(it.ex);
  if (it.pos === '熟') return ex;
  const alts = [it.w, ...(it.forms ? it.forms.split('-') : [])].map(w => (w.length > 3 && /[ey]$/.test(w)) ? w.slice(0, -1) : w);
  const re = new RegExp('\\b(' + [...new Set(alts)].join('|') + ')[a-z]*', 'i');
  return ex.replace(re, m => '<b>' + m + '</b>');
}
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2200); }
function markDay() { const d = today(); if (!S.days.includes(d)) S.days.push(d); S.days = S.days.slice(-90); }
function streak() {
  const set = new Set(S.days); let d = today(); if (!set.has(d)) d--; let n = 0;
  while (set.has(d)) { n++; d--; } return n;
}
function todayCount() { const d = today(); return Object.values(S.p).filter(e => e.d === d).length; }
function scopePool(mode) {
  const s = S.settings;
  return WORDS.filter(x => s.pos.includes(x.pos) && s.lv.includes(x.lv) && (mode !== 'spell' || x.pos !== '熟') && (!s.weak || isWeak(x.id)));
}

      <div class="field"><span class="lab">レベル</span><div class="chips">${Object.keys(LV).map(l => chip('lv', l, LV[l], s.lv.includes(l))).join('')}</div></div>
      <div class="field"><span class="lab">出題の向き（カード・4択）</span><div class="chips">${chip('dir', 'ej', '英語 → 日本語', s.dir === 'ej')}${chip('dir', 'je', '日本語 → 英語', s.dir === 'je')}</div></div>
      <div class="field"><span class="lab">1回の問題数</span><div class="chips">${[10, 20, 30].map(n => chip('size', n, n + '問', s.size === n)).join('')}</div></div>
      <div class="field"><span class="lab">発音</span><div class="chips">${chip('auto', 1, '自動で読み上げる', s.auto)}</div></div>
      <button class="weakbtn" id="weak" aria-pressed="${s.weak}">苦手な語だけ出す（${weakN}語）</button>
      <div class="scopecount">出題範囲 <b class="num">${pool.length}</b> 語</div>
      <p class="note">山梨県公立高校入試の過去問6年分（2021〜2026年度）で、何年分に出たかで分けています。最頻出＝4〜6年分、頻出＝2〜3年分、重要＝1年分以下（出題は少ないが覚えておきたい語）。</p>
    </section>
    <section>
      <h2>品詞ごとの進み具合</h2>
      <div class="posrows">${POS_ORDER.map(p => {
        const ws = WORDS.filter(x => x.pos === p), n = ws.length;
        const l = ws.filter(x => isLearned(x.id)).length, sn = ws.filter(x => isSeen(x.id) && !isLearned(x.id)).length;
        return `<div class="posrow"><span>${POSL[p]}</span><div class="bar"><i class="l" style="width:${l / n * 100}%"></i><i class="s" style="width:${sn / n * 100}%"></i></div><span class="num">${l}/${n}</span></div>`;
      }).join('')}</div>
    </section>
    <div id="sync"></div>
    <div><button class="danger${resetArmed ? ' arm' : ''}" id="reset">${resetArmed ? 'もう一度押すと記録をすべて消します' : '学習記録をリセット'}</button></div>
  `;
  renderSync($('#sync'));
}
$('#home').addEventListener('click', e => {
  const m = e.target.closest('[data-mode]');
  if (m) { startSession(m.dataset.mode); return; }
  const c = e.target.closest('.chip');
  if (c) {
    const s = S.settings, g = c.dataset.grp, v = c.dataset.val;
    if (g === 'pos' || g === 'lv') {
      const arr = s[g]; const i = arr.indexOf(v);
      if (i >= 0) { if (arr.length === 1) { toast('1つ以上選んでください'); return; } arr.splice(i, 1); } else arr.push(v);
    } else if (g === 'dir') s.dir = v;
    else if (g === 'size') s.size = +v;
    else if (g === 'auto') s.auto = !s.auto;
    hadLocalSettings = true; persist(); renderHome(); return;
  }
  if (e.target.closest('#btn-install')) { doInstall(); return; }
  if (e.target.closest('#btn-copyurl')) { copyUrl(); return; }
  if (e.target.closest('#btn-later')) { try { localStorage.setItem(LS_KEY + '-install-later', String(today())); } catch (er) {} renderHome(); return; }
  if (e.target.closest('#weak')) {
    if (!S.settings.weak && !WORDS.some(x => isWeak(x.id))) { toast('苦手な語はまだありません'); return; }
    S.settings.weak = !S.settings.weak; persist(); renderHome(); return;
  }
  if (e.target.closest('#reset')) {
    if (!resetArmed) { resetArmed = true; renderHome(); setTimeout(() => { if (resetArmed) { resetArmed = false; renderHome(); } }, 4000); return; }
    resetArmed = false; S.p = {}; S.days = []; S.settings.weak = false; persist(); if (docRef) { clearTimeout(saveTimer); pushRemote(); }
    renderHome(); toast('学習記録をリセットしました');
  }
});

/* ---------- 一覧 ---------- */
let listQ = '', listF = 'all', openId = null;
function renderList() {
  const fs = [['all', 'すべて'], ['weak', '苦手'], ['learn', '覚えた'], ['new', 'まだ']];
  $('#list').innerHTML = `
    <header><div class="eyebrow">全${WORDS.length}語</div><h1>単語一覧</h1></header>
    <input id="q" class="search" type="search" placeholder="英語か日本語で探す" value="${esc(listQ)}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="seg">${fs.map(([k, l]) => `<button class="chip" data-f="${k}" aria-pressed="${listF === k}">${l}</button>`).join('')}</div>
    <div class="wl" id="wl"></div>`;
  renderRows();
}
function renderRows() {
  const q = listQ.trim().toLowerCase();
  const rows = WORDS.filter(x => {
    if (q && !x.w.toLowerCase().includes(q) && !x.ja.includes(q)) return false;
    if (listF === 'weak') return isWeak(x.id);
    if (listF === 'learn') return isLearned(x.id);
    if (listF === 'new') return !isSeen(x.id);
    return true;
  });
  const dot = id => isLearned(id) ? 'learn' : isWeak(id) ? 'weak' : isSeen(id) ? 'seen' : '';
  $('#wl').innerHTML = rows.length ? rows.map(x => `
    <div class="wrow">
      <button data-id="${esc(x.id)}" aria-expanded="${openId === x.id}"><span class="dot ${dot(x.id)}"></span><span style="min-width:0"><span class="en">${esc(x.w)}</span><span class="ja">${esc(x.ja)}</span></span><span class="tag ${x.lv}">${yLabel(x)}</span></button>
      ${openId === x.id ? `<div class="wdetail">${x.forms ? `<div class="forms">${esc(x.w)} – ${x.forms.split('-').map(esc).join(' – ')}</div>` : ''}<div class="ex">${hl(x)}</div><div class="exja">${esc(x.exja)}</div><button class="spk" data-say="${esc(x.id)}">${SPK}発音を聞く</button></div>` : ''}
    </div>`).join('') : '<div class="empty">該当する単語はありません</div>';
}
$('#list').addEventListener('input', e => { if (e.target.id === 'q') { listQ = e.target.value; renderRows(); } });
$('#list').addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { listF = f.dataset.f; renderList(); return; }
  const sp = e.target.closest('[data-say]'); if (sp) { const x = BYID[sp.dataset.say]; speak(x.w); return; }
  const r = e.target.closest('[data-id]'); if (r) { openId = openId === r.dataset.id ? null : r.dataset.id; renderRows(); }
});

/* ---------- 学習セッション ---------- */
let Q = null;
function pickItems(mode) {
  const pool = scopePool(mode);
  const scored = pool.map(x => {
    const e = st(x.id); let sc = Math.random();
    if (!e) sc += 2 + x.y * 0.2; else if (isWeak(x.id)) sc += isDue(x.id) ? 3.2 : 1.2; else if (isDue(x.id)) sc += 1.5; else sc *= 0.5;
    return [sc, x];
  }).sort((a, b) => b[0] - a[0]);
  return shuffle(scored.slice(0, S.settings.size).map(a => a[1]));
}
function startSession(mode, items) {
  items = items || pickItems(mode);
  if (!items.length) { toast('出題範囲に単語がありません'); return; }
  Q = { mode, items, i: 0, res: [], flipped: false, answered: null, choices: null, typed: '' };
  prep(); $('#study').hidden = false; document.body.style.overflow = 'hidden'; renderStudy();
}
function prep() {
  Q.flipped = false; Q.answered = null; Q.typed = '';
  if (Q.mode === 'quiz') {
    const it = Q.items[Q.i], key = S.settings.dir === 'ej' ? 'ja' : 'w';
    const others = shuffle(WORDS.filter(x => x.pos === it.pos && x.id !== it.id && x[key] !== it[key])).slice(0, 3);
    Q.choices = shuffle([it, ...others]);
  }
  const it = Q.items[Q.i];
  if (S.settings.auto && Q.mode !== 'spell' && S.settings.dir === 'ej') speak(it.w);
}
function record(it, ok, known) {
  const e = S.p[it.id] || { b: 0, d: 0, n: 0, x: 0 };
  e.n++; e.d = today();
  if (ok) e.b = known ? Math.max(e.b + 1, 3) : Math.min(5, e.b + 1);
  else { e.b = 1; e.x++; }
  e.b = Math.min(5, e.b);
  S.p[it.id] = e; markDay(); persist();
  Q.res.push({ it, ok });
}
function next() {
  Q.i++;
  if (Q.i >= Q.items.length) { Q.done = true; renderStudy(); return; }
  prep(); renderStudy();
}
function closeStudy() { $('#study').hidden = true; document.body.style.overflow = ''; Q = null; try { speechSynthesis.cancel(); } catch (e) {} render(); }
function answerBlock(it) {
  return `<div class="ans">
    <div class="headword" style="font-size:26px">${esc(it.w)}</div>
    <div class="ja">${esc(it.ja)}</div>
    ${it.forms ? `<div class="forms">${esc(it.w)} – ${it.forms.split('-').map(esc).join(' – ')}</div>` : ''}
    <div class="ex">${hl(it)}</div><div class="exja">${esc(it.exja)}</div>
    <button class="spk" data-act="say">${SPK}発音を聞く</button>
  </div>`;
}
function renderStudy() {
  const el = $('#study');
  if (Q.done) {
    const ok = Q.res.filter(r => r.ok).length, miss = Q.res.filter(r => !r.ok);
    const label = Q.mode === 'card' ? '覚えた' : '正解';
    el.innerHTML = `<div class="sin"><div class="shead"><button class="x" data-act="close" aria-label="閉じる">×</button><div class="prog"><i style="width:100%"></i></div><span class="scount num">完了</span></div>
      <div class="sbody"><div class="res">
        <div class="eyebrow">${label}</div>
        <div class="score num">${ok}<small> / ${Q.res.length}</small></div>
        ${miss.length ? `<h2 style="margin:6px 0 0">${Q.mode === 'card' ? 'まだの語' : '間違えた語'}（${miss.length}）</h2><div class="missl">${miss.map(r => `<div><span class="en">${esc(r.it.w)}</span><span class="ja">${esc(r.it.ja)}</span></div>`).join('')}</div>` : '<p>全部できました。次は別のモードでも確かめてみましょう。</p>'}
      </div></div>
      <div class="sfoot">${miss.length ? '<button class="btn ghost" data-act="home">ホームへ</button><button class="btn" data-act="retry">間違えた語をもう一度</button>' : '<button class="btn ghost" data-act="home">ホームへ</button><button class="btn" data-act="again">続けて学習する</button>'}</div></div>`;
    return;
  }
  const it = Q.items[Q.i], n = Q.items.length, ej = S.settings.dir === 'ej';
  const head = `<div class="shead"><button class="x" data-act="close" aria-label="学習をやめる">×</button><div class="prog"><i style="width:${Q.i / n * 100}%"></i></div><span class="scount num">${Q.i + 1} / ${n}</span></div>`;
  const posTag = `<span class="tag poslab ${it.lv}">${POSL[it.pos]}・${yLabel(it)}</span>`;
  let body = '', foot = '';
  if (Q.mode === 'card') {
    const front = ej ? `<div class="headword">${esc(it.w)}</div>` : `<div class="headja">${esc(it.ja)}</div>`;
    body = Q.flipped
      ? `<div class="wcard">${posTag}${front}${answerBlock(it)}</div>`
      : `<button class="wcard" data-act="flip" aria-label="カードをめくる">${posTag}${front}<div class="hint">タップして答えを見る</div></button>`;
    foot = Q.flipped ? '<button class="btn ng" data-act="no">まだ</button><button class="btn ok" data-act="yes">覚えた</button>' : '<button class="btn" data-act="flip">答えを見る</button>';
  } else if (Q.mode === 'quiz') {
    const prompt = ej ? `<div class="headword">${esc(it.w)}</div>` : `<div class="headja">${esc(it.ja)}</div>`;
    const a = Q.answered;
    body = `<div class="wcard" style="min-height:150px">${posTag}${prompt}${a ? `<div class="verdict ${a.ok ? 'ok' : 'ng'}">${a.ok ? '正解' : '不正解'}</div>` : '<div class="hint">' + (ej ? '意味を選んでください' : '英語を選んでください') + '</div>'}</div>
      <div class="choices">${Q.choices.map((c, k) => {
        let cls = 'choice' + (ej ? '' : ' en');
        if (a) { if (c.id === it.id) cls += ' right'; else if (k === a.k) cls += ' wrong'; }
        return `<button class="${cls}" data-act="pick" data-k="${k}" ${a ? 'disabled' : ''}>${esc(ej ? c.ja : c.w)}</button>`;
      }).join('')}</div>${a ? answerBlock(it) : ''}`;
    foot = a ? `<button class="btn" data-act="next">${Q.i + 1 < n ? '次へ' : '結果を見る'}</button>` : '';
  } else {
    const a = Q.answered;
    const letters = it.w.split('').map((ch, k) => k === 0 ? ch : (ch === ' ' ? '  ' : '_')).join(' ');
    body = `<div class="wcard" style="min-height:170px">${posTag}<div class="headja">${esc(it.ja)}</div><div class="letters" aria-label="${it.w.length}文字、${esc(it.w[0])}で始まる">${esc(letters)}</div><div class="hint">${it.w.length}文字</div>${a ? `<div class="verdict ${a.ok ? 'ok' : 'ng'}">${a.ok ? '正解' : '正しくは ' + esc(it.w)}</div>` : ''}</div>
      <form id="spf" autocomplete="off"><input id="spin" class="spell${a ? (a.ok ? ' ok' : ' ng') : ''}" type="text" inputmode="latin" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="英語で入力" value="${esc(Q.typed)}" ${a ? 'readonly' : ''} aria-label="英単語を入力"></form>
      ${a ? answerBlock(it) : ''}`;
    foot = a ? `<button class="btn" data-act="next">${Q.i + 1 < n ? '次へ' : '結果を見る'}</button>` : '<button class="btn ghost" data-act="giveup">わからない</button><button class="btn" data-act="check">答え合わせ</button>';
  }
  el.innerHTML = `<div class="sin">${head}<div class="sbody">${body}</div><div class="sfoot">${foot}</div></div>`;
  if (Q.mode === 'spell' && !Q.answered) { const inp = $('#spin'); setTimeout(() => { try { inp.focus(); } catch (e) {} }, 50); }
}
function checkSpell(give) {
  const it = Q.items[Q.i], v = ($('#spin')?.value || '').trim();
  if (!give && !v) { toast('英単語を入力してください'); return; }
  Q.typed = v;
  const ok = !give && v.toLowerCase().replace(/\s+/g, ' ') === it.w.toLowerCase();
  Q.answered = { ok }; record(it, ok); renderStudy(); speak(it.w);
}
$('#study').addEventListener('submit', e => { e.preventDefault(); if (Q && Q.mode === 'spell' && !Q.answered) checkSpell(false); });
$('#study').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !Q) return;
  const act = b.dataset.act, it = Q.items[Q.i];
  if (act === 'close' || act === 'home') return closeStudy();
  if (act === 'say') { speak(it ? it.w : ''); e.stopPropagation(); return; }
  if (act === 'flip') { if (!Q.flipped) { Q.flipped = true; renderStudy(); if (S.settings.auto && S.settings.dir === 'je') speak(it.w); } return; }
  if (act === 'yes' || act === 'no') { record(it, act === 'yes', act === 'yes' && !isSeen(it.id)); next(); return; }
  if (act === 'pick') {
    const k = +b.dataset.k, ok = Q.choices[k].id === it.id;
    Q.answered = { ok, k }; record(it, ok); renderStudy();
    if (S.settings.auto && S.settings.dir === 'je') speak(it.w);
    return;
  }
  if (act === 'next') return next();
  if (act === 'check') return checkSpell(false);
  if (act === 'giveup') return checkSpell(true);
  if (act === 'retry') { const mode = Q.mode, items = shuffle(Q.res.filter(r => !r.ok).map(r => r.it)); return startSession(mode, items); }
  if (act === 'again') { const mode = Q.mode; return startSession(mode); }
});

/* ---------- タブ ---------- */
let tab = 'home';
function render() { if (tab === 'home') renderHome(); else renderList(); }
function setTab(t) {
  tab = t; $('#home').hidden = t !== 'home'; $('#list').hidden = t !== 'list';
  $('#tab-home').setAttribute('aria-current', t === 'home' ? 'page' : 'false');
  $('#tab-list').setAttribute('aria-current', t === 'list' ? 'page' : 'false');
  render(); window.scrollTo(0, 0);
}
$('#tab-home').onclick = () => setTab('home');
$('#tab-list').onclick = () => setTab('list');
/* ---------- ホーム画面に追加（PWA） ----------
   Android の Chrome などはボタン1つで追加できる。iPhone は手順を案内する。
   アプリ内ブラウザ（LINE など）では追加できないので、ブラウザで開き直すよう案内する */
let deferredPrompt = null;
function isStandalone() {
  try {
    return matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches || navigator.standalone === true;
  } catch (e) { return false; }
}
function browserInfo() {
  const ua = navigator.userAgent;
  if (/Line\//i.test(ua)) return { inapp: 'LINE' };
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return { inapp: 'Facebook' };
  if (/Instagram/i.test(ua)) return { inapp: 'Instagram' };
  if (/Twitter/i.test(ua)) return { inapp: 'X（Twitter）' };
  if (/; wv\)/.test(ua)) return { inapp: 'ほかのアプリ' };
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) return { ios: true, notSafari: /CriOS|FxiOS|EdgiOS/.test(ua) };
  if (/Android/.test(ua)) return { android: true };
  return { pc: true };
}
function installHTML() {
  if (isStandalone() || !/^https?:$/.test(location.protocol)) return '';
  let later = null; try { later = localStorage.getItem(LS_KEY + '-install-later'); } catch (e) {}
  if (later && today() - +later < 7) return '';
  const b = browserInfo();
  let title = 'ホーム画面に追加しよう', msg = '', btn = '';
  if (deferredPrompt) {
    msg = 'ボタンを押すと、ホーム画面のアイコンからすぐに学習を始められます。';
    btn = '<button class="primary" id="btn-install">ホーム画面に追加</button>';
  } else if (b.inapp) {
    title = b.inapp + 'の中で開いています';
    msg = 'このままでは追加できません。画面のすみの <b>⋮</b> や <b>…</b> から <b>「ブラウザで開く」</b> を選んで開き直してください。うまくいかないときは「URLをコピー」して、Safari や Chrome に貼り付けてください。';
  } else if (b.ios) {
    msg = b.notSafari
      ? 'iPhone では <b>Safari</b> で開いてください。Safari の <b>共有ボタン（□に↑）</b> → <b>「ホーム画面に追加」</b> を選びます。'
      : '画面下の <b>共有ボタン（□に↑）</b> を押し、メニューを下にたどって <b>「ホーム画面に追加」</b> を選んでください。';
  } else if (b.android) {
    msg = 'Chrome の <b>⋮</b> メニューから <b>「ホーム画面に追加」</b>（または「アプリをインストール」）を選んでください。';
  } else {
    title = 'スマホでも使えます';
    msg = 'スマホのブラウザでこのページを開き、ホーム画面に追加すると、アプリと同じように使えます。';
  }
  return `<section class="install" aria-label="ホーム画面に追加">
    <img src="icons/icon-192.png" alt="">
    <div><b>${title}</b><p>${msg}</p></div>
    <div class="row">${btn}<button id="btn-copyurl">URLをコピー</button><button class="later" id="btn-later">あとで</button></div>
  </section>`;
}
async function doInstall() {
  if (!deferredPrompt) { renderHome(); return; }
  const p = deferredPrompt; deferredPrompt = null;
  try { p.prompt(); const r = await p.userChoice; if (r && r.outcome === 'accepted') toast('ホーム画面に追加しました'); } catch (e) {}
  renderHome();
}
function copyUrl() {
  const url = location.href.split('#')[0];
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(() => toast('URLをコピーしました'))
    .catch(() => toast(url));
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; if (tab === 'home' && !Q) renderHome(); });
window.addEventListener('appinstalled', () => { deferredPrompt = null; toast('ホーム画面に追加しました'); renderHome(); });
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

if (location.hash === '#list') setTab('list'); else render();
initSync();
</script>
</body>
